name: Build signed release APK
# Runs on every push to main, and by hand: GitHub > Actions > "Build signed release APK" > Run workflow.
# Needs four secrets IN THIS REPOSITORY (GitHub does not copy secrets from another repo; a new repo starts with none):
#   RELEASE_KEYSTORE_B64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Get them in Termux with `bash make_signing_key.sh` (it keeps your existing key and writes OkLauncher-github-secrets.txt again),
# then GitHub > Settings > Secrets and variables > Actions > New repository secret. The same key signs every update.
# Same proven way as the Ui9 repo: Gradle makes the unsigned release APK, then apksigner signs it.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check the signing secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for v in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty secret(s) in THIS repository:$missing. Add them: GitHub > Settings > Secrets and variables > Actions (values from: bash make_signing_key.sh)."
            exit 1
          fi

      - name: Decode the keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oneui9-release.jks"

      - name: Gradle permission
        run: chmod +x gradlew

      - name: Build the release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon -Poneui.sdk=34

      - name: Find apksigner
        run: |
          yes | sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)" >> $GITHUB_ENV

      - name: Sign the APK with apksigner
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          UNSIGNED=$(ls app/build/outputs/apk/release/*unsigned*.apk 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1); fi
          test -f "$UNSIGNED" || { echo "::error::The release APK was not built."; ls app/build/outputs/apk/release; exit 1; }
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/oneui9-release.jks" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --out signed-release.apk \
            "$UNSIGNED"
          "$BT/apksigner" verify --print-certs signed-release.apk

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorPanel-signed-apk
          path: signed-release.apk
